<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${title ?: 'Conflit de données'}, 'none', ~{::main}, ~{})}">
<body>
<main class="content">
    <div class="error-page">
        <div class="code" th:text="${status ?: 409}">409</div>
        <h1 th:text="${title ?: 'Conflit de données'}">Conflit de données</h1>
        <p th:text="${message ?: 'Une erreur est survenue.'}">Message</p>
        <a th:href="@{/}" class="btn btn-primary">Retour au tableau de bord</a>
    </div>
</main>
</body>
</html>
