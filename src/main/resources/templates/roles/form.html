<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Rôle', 'roles', ~{::main}, ~{})}">
<body>
<main class="content">
    <div class="page-head"><div><h1 th:text="${roleId != null} ? 'Modifier le rôle' : 'Nouveau rôle'">Rôle</h1></div></div>
    <!-- RoleController: create = POST /roles, update = POST /roles/{id} -->
    <form class="card card-pad form-card" method="post" novalidate
          th:action="${roleId != null} ? @{/roles/{id}(id=${roleId})} : @{/roles}">
        <div class="form-grid">
            <div class="full" th:replace="~{layout/fields :: input('role', 'Nom du rôle', 'nom', 'text', true)}"></div>
            <div class="full" th:replace="~{layout/fields :: textarea('role', 'Description', 'description')}"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><svg class="i"><use href="#i-check"/></svg>Enregistrer</button>
            <a th:href="@{/roles}" class="btn">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
