<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Produit', 'produits', ~{::main}, ~{})}">
<body>
<main class="content">
    <div class="page-head"><div><h1 th:text="${produitId != null} ? 'Modifier le produit' : 'Nouveau produit'">Produit</h1></div></div>

    <form class="card card-pad form-card" method="post" novalidate
          th:action="${produitId != null} ? @{/produits/{id}/edit(id=${produitId})} : @{/produits}">
        <div class="form-grid">
            <div th:replace="~{layout/fields :: input('produit', 'Référence', 'reference', 'text', true)}"></div>
            <div th:replace="~{layout/fields :: input('produit', 'Nom du produit', 'nom', 'text', true)}"></div>
            <div class="full" th:replace="~{layout/fields :: textarea('produit', 'Description', 'description')}"></div>
            <div th:replace="~{layout/fields :: input('produit', 'Prix (MAD)', 'prix', 'number', true)}"></div>
            <div class="field">
                <label for="categorieId">Catégorie <span class="req">*</span></label>
                <select class="select" id="categorieId" name="categorieId">
                    <option value="">Choisir…</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.nom}"
                            th:selected="${produit?.categorieId != null and produit.categorieId == c.id}">Cat</option>
                </select>
                <th:block th:replace="~{layout/fields :: error('produit', 'categorieId')}"></th:block>
            </div>
            <div th:replace="~{layout/fields :: input('produit', 'Quantité en stock', 'quantiteStock', 'number', true)}"></div>
            <div th:replace="~{layout/fields :: input('produit', 'Seuil d’alerte', 'seuilAlerte', 'number', true)}"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><svg class="i"><use href="#i-check"/></svg>Enregistrer</button>
            <a th:href="@{/produits}" class="btn">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
